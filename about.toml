# cargo-about configuration: generates THIRD_PARTY_LICENSES.txt, the notices
# for the Rust crates linked into the release binaries (release.yml, "Package").
# The accepted list mirrors deny.toml [licenses] allow, plus clove's own
# AGPL-3.0-only (clove's crates appear in the graph too).
# Regenerate locally with:
#   cargo about generate --features clove-cli/full,cloved/full about.hbs > THIRD_PARTY_LICENSES.txt
# (cargo-about 0.9.2: `cargo install cargo-about --version 0.9.2 --features cli --locked`)
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "CC0-1.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "AGPL-3.0-only",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
