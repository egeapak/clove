# cargo-nextest configuration. CI runs `cargo nextest run --profile ci`.
# https://nexte.st/docs/configuration/

[profile.ci]
# Run every test and report all failures, not only the first one.
fail-fast = false
# Mark a test as slow after 60 s, and stop it after 5 periods (5 minutes), so
# a hung test fails with its name instead of running to the job timeout.
slow-timeout = { period = "60s", terminate-after = 5 }
# Print the output of failing tests at the end, after the summary.
failure-output = "immediate-final"
