[package]
# The published crate is `clove-cli` (the crates.io name `clove` is taken); the
# installed binary and command stay `clove` (see `[[bin]]` below). `cargo install
# clove-cli` gives you the `clove` command.
name = "clove-cli"
description = "clove: a fast, git-native, dependency-aware work-item tracker"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "clove"

[[bin]]
name = "clove"
path = "src/main.rs"

# The host carries no *integration* network dependencies: `clove sync github`
# resolves the external `clove-sync-github` plugin (PLUGIN_SYSTEM.md §4.2/§8), so
# there is no in-process `github` feature and `clove-import` is used only for its
# pure file-format layers (tk/beads/json/jsonl/merge-driver).
#
# The one network dependency the host does carry is the crates.io registry client
# (`ureq`, src/registry/) behind `clove plugin list --all` / `search`. That is
# discovery plumbing, not an integration, and it is always on so there is a single
# code path and no "curl not installed" failure mode. Dispatch itself
# (`clove sync github` → exec the plugin) stays a pure `stat` walk and never
# touches the network.
[features]
default = ["mcp"]
full = ["mcp"]
# `mcp` wires the `clove mcp` subcommand to the clove-mcp (rmcp) server. Kept in
# `default` (it is small); `--no-default-features` drops it (the subcommand then
# errors cleanly) for the leanest cross builds.
mcp = ["dep:clove-mcp"]

[dependencies]
clove-types.workspace = true
clove-core.workspace = true
clove-index.workspace = true
clove-engine.workspace = true   # the daemon -> index -> files read cascade (read-path roadmap §4)
clove-import = { workspace = true, default-features = false }   # M2 import/export/merge-driver (pure file formats only; no github)
clove-plugin.workspace = true    # single source of truth for CLOVE_PLUGIN_API (host↔plugin compat, PLUGIN_REGISTRY.md §2)
clove-ipc.workspace = true       # M3: daemon liveness probe + QUERY routing
clove-mcp = { workspace = true, optional = true }   # M4: `clove mcp` server (rmcp), behind the `mcp` feature
clove-tui.workspace = true       # M4: `clove tui` terminal browser + add/edit form
clove-web.workspace = true       # M4: `clove serve` web UI server
tokio.workspace = true           # M4: async runtime for `clove serve`
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
camino.workspace = true
chrono.workspace = true
tempfile.workspace = true       # T-M04: atomic `export --out FILE` writes
ureq.workspace = true            # crates.io registry client (registry/, `plugin list --all`)
semver.workspace = true          # crates.io version ordering

# `clove daemon stop` on Windows signals the daemon's named event (DESIGN §8.9).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    # See cloved/Cargo.toml: OpenEventW/SetEvent reach SECURITY_ATTRIBUTES via
    # Win32_Security; required explicitly for the windows-gnu target.
    "Win32_Security",
    "Win32_System_Threading",
] }

[dev-dependencies]
assert_cmd.workspace = true
escargot.workspace = true         # build the sibling `cloved` bin for the daemon-auto-start test
fd-lock.workspace = true          # hold the sync lock to test concurrent-sync rejection
insta = { workspace = true, features = ["json"] }       # golden CLI snapshot tests (T-X01 acceptance gate)
tempfile.workspace = true
jsonschema.workspace = true       # T-CLI14: validate JSON output against v1 schema
rusqlite.workspace = true         # doctor: stamp an old index user_version to exercise INDEX_SCHEMA_MISMATCH
