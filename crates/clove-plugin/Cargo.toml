# The plugin SDK every clove plugin (and the host) depends on: it materializes
# the host↔plugin env contract (PLUGIN_SYSTEM.md §6.2/§6.5) into a typed
# `PluginContext` and renders the standard `{ v, ok, data, _meta }` envelope +
# exit codes so a plugin `main` is a thin wrapper around its provider logic.
#
# Licensing: this crate is MIT OR Apache-2.0 (the rest of clove is AGPL-3.0-only)
# so a plugin built on it can use any license. It must never depend on an AGPL
# clove crate (clove-core, clove-engine, …) in any feature combination; CI
# enforces this (`.github/workflows/ci.yml`, "SDK license guard").
[package]
name = "clove-plugin"
description = "clove plugin support: typed PluginContext + envelope/exit-code harness for clove-* subcommand plugins"
edition.workspace = true
version.workspace = true
license = "MIT OR Apache-2.0"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
clove-types.workspace = true
camino.workspace = true
serde.workspace = true
chrono.workspace = true
serde_json.workspace = true
# The host IPC client (`host.rs`): the sync local-socket API only (no tokio).
interprocess.workspace = true
# Optional: only the `clap`-based plugin mains (almost all of them) enable this to
# reuse the shared `clap_exit_code`/`parse_format` helpers. Gated so the contract
# crate stays clap-free for a host or a hand-parsed plugin that does not need it.
clap = { workspace = true, optional = true }

[features]
# Enables the shared clap helpers (`clove_plugin::{clap_exit_code, parse_format}`).
clap = ["dep:clap"]
