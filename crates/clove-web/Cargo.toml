[package]
name = "clove-web"
description = "clove web UI: HTTP/WebSocket server and embedded SPA (M4)"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# `dist-gz/` is git-ignored (it is generated), so it ships only because it is
# named here — and it must ship, or `cargo install` on a machine without npm
# embeds the placeholder UI instead of the real SPA. Listing `include` at all
# also drops `web/` (the SvelteKit sources) and `tests/` from the .crate, which
# is intended: the published crate carries the built assets, not the toolchain
# that builds them. Keep `build.rs`'s prebuilt guard in step with this list.
include = ["src/**", "build.rs", "dist-gz/**"]

[dependencies]
clove-types.workspace = true
clove-core.workspace = true
clove-index.workspace = true
clove-engine.workspace = true
axum.workspace = true
tower-http.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
camino.workspace = true
chrono.workspace = true
notify.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
flate2.workspace = true
futures-util.workspace = true

[build-dependencies]
flate2.workspace = true

[dev-dependencies]
tempfile.workspace = true
clove-index.workspace = true    # tests build a real index to exercise the index tier
# tests/api.rs drives a real server over TCP with #[tokio::test]; use full tokio
# for tests so the release lib can keep the trimmed feature set.
tokio = { workspace = true, features = ["full"] }
