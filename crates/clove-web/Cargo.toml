[package]
name = "clove-web"
description = "clove web UI: HTTP/WebSocket server and embedded SPA (M4)"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# The built SPA is not packaged: a published `clove-web` downloads it from this
# version's GitHub Release at build time (see `build.rs`), so nothing generated
# has to ride in the .crate and `cargo publish` needs no `--allow-dirty`. Listing
# `include` also drops `web/` (the SvelteKit sources) and `tests/`. `build/` holds
# modules `build.rs` pulls in, so it must ship.
include = ["src/**", "build.rs", "build/**"]

[dependencies]
clove-types.workspace = true
clove-core.workspace = true
clove-index.workspace = true
clove-engine.workspace = true
axum.workspace = true
tower-http.workspace = true
tower.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
camino.workspace = true
chrono.workspace = true
notify.workspace = true
mime_guess.workspace = true
flate2.workspace = true
futures-util.workspace = true
sha2.workspace = true
base64.workspace = true

[build-dependencies]
flate2.workspace = true
sha2.workspace = true
tar.workspace = true
ureq.workspace = true

[dev-dependencies]
tempfile.workspace = true
tar.workspace = true            # tests/packaging.rs exercises build/fetch.rs
clove-index.workspace = true    # tests build a real index to exercise the index tier
# tests/api.rs drives a real server over TCP with #[tokio::test]; use full tokio
# for tests so the release lib can keep the trimmed feature set.
tokio = { workspace = true, features = ["full"] }
