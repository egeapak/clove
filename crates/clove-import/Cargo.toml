[package]
name = "clove-import"
description = "clove importers/exporters: beads, tk, github"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# File-based importers (beads/tk) use only clove-core; the GitHub
# importer/exporter (T-M03) adds tokio + octocrab behind the `github` feature.
# `github` is **opt-out** (not in `default`) so a lean build stays free of that
# ~3.5 MB of vendored TLS/HTTP; enable it with `--features github`.
[features]
default = []
github = [
    "dep:octocrab", "dep:tokio", "dep:rustls", "dep:fd-lock",
    "dep:http", "dep:hyper-util", "dep:hyper-rustls", "dep:tower-service", "dep:tower-http",
]
# Honour `CLOVE_GITHUB_RETRY_MS` (instant sync retries for the test-suite).
# Test-only; enabled through `clove-sync-github/test-knobs` (#61).
test-knobs = []

[dependencies]
clove-types.workspace = true
clove-core.workspace = true
# The host IPC client (`store::HostStore`): the shipped plugins read and write
# through the `clove` that runs them.
clove-plugin.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
camino.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
# Stable, versioned content hash for the persisted comment-dedup fingerprints.
# std's DefaultHasher is explicitly unstable across Rust releases, so a persisted
# hash must not use it (see `sync::body_hash`); blake3 is the project's chosen
# content hasher (clove-core) and is fixed across releases/machines.
blake3.workspace = true

# GitHub-only deps, gated behind the `github` feature.
octocrab = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
# rustls is pulled transitively by octocrab/hyper-rustls with BOTH the ring and
# aws-lc-rs providers compiled in (feature unification), so rustls cannot pick a
# default and panics on first TLS use. We depend on it directly (ring) to install
# the ring provider explicitly before building the client (see github.rs).
rustls = { workspace = true, optional = true }
# HTTPS_PROXY / NO_PROXY support (`proxy.rs`): a CONNECT-tunnel connector under
# the same hyper-rustls TLS octocrab uses. octocrab's own builder cannot take a
# connector, so the proxied client is assembled from octocrab's public layers,
# plus tower-http's follow-redirect (as octocrab's `follow-redirect` feature does).
http = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
hyper-rustls = { workspace = true, optional = true }
tower-service = { workspace = true, optional = true }
# Not the workspace entry: that one adds `compression-gzip` for clove-web.
tower-http = { version = "0.6", default-features = false, features = ["follow-redirect"], optional = true }
# Advisory lock so a daemon sync and a manual `clove sync` of the same repo can't
# interleave (which could create duplicate issues). github-only.
fd-lock = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true     # T-X01: export throughput bench (informational)
tempfile.workspace = true
camino.workspace = true
proptest.workspace = true      # T-M05: set-merge invariant property tests

[[bench]]
name = "bench_export"
harness = false

[[bench]]
name = "bench_import_tk"
harness = false

[[bench]]
name = "bench_import_beads"
harness = false
