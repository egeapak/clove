name: CI

on:
  push:
    branches: [main, master]
  # A PR that only touches prose skips CI. Files a build or test reads stay
  # triggers: CLOVE.md (pinned by `clove setup`'s test) and docs/json-schema
  # (validated against by the CLI tests). DCO (dco.yml) runs on every PR when
  # the REQUIRE_DCO repository variable is `true`.
  pull_request:
    paths:
      - '**'
      - '!*.md'
      - 'CLOVE.md'
      - '!docs/**'
      - 'docs/json-schema/**'
      - '!.claude-plugin/README.md'

# On Windows the default shell is PowerShell, which reports only the exit code
# of the last command in a multi-line `run:`. A failure in the first of two
# commands (the --all-features test or clippy arm) was ignored there, so every
# step runs in bash, which stops at the first failing command.
defaults:
  run:
    shell: bash

# No job here writes to the repository. Third-party actions are pinned to a
# commit, so a moved tag cannot change what runs with this token.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# A newer push to the same PR cancels the run in progress for the older one.
# Pushes to master are never cancelled, so every merged commit gets a full run
# (and saves the caches that PRs restore from).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lints and tests are separate jobs: `cargo clippy` writes check metadata and
  # `cargo test` writes full builds, so the two share almost no artifacts, and
  # running them side by side takes the clippy time off the critical path.
  lint:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Only master saves caches; PRs restore master's. Every PR saving its
          # own ~1 GB per job filled the 10 GB repository cache limit, so caches
          # were evicted before the next run and almost every job started cold.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Format check
        # Formatting does not depend on the platform.
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        # --all-features covers clove-import's `github` network layer (enabled by
        # the clove-sync-github plugin); the second, default arm is the lean core
        # that `cargo install clove-cli` builds. The clove-sync-github plugin crate
        # is in the workspace, so both arms lint it too. `--all-targets` also
        # type-checks the benches on both arms.
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung test fails the job instead of holding the runner for 6 hours.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install cargo-nextest
        # A fixed version: .config/nextest.toml uses the experimental
        # `setup-scripts` key, which a new nextest may rename or change.
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: nextest@0.9.152
      - name: Test
        # cargo-nextest runs every test in its own process. Its setup script
        # (.config/nextest.toml, `cargo xtask test-bins`) builds `cloved` and the
        # plugins that the clove-cli suites spawn once per run, before any test,
        # so every test runs the same binaries. --all-features exercises
        # clove-import's github mapping/network tests. The second arm is the lean
        # default build of the CLI and of cloved's own tests. The daemon that the
        # clove-cli suites spawn is the all-features `cloved` from the setup
        # script on both arms (those suites need its test knobs), so a default
        # `cloved` is covered by its own tests only. The sync_github mock suite
        # runs on both arms (proving clove sync github dispatches to the plugin
        # end to end). nextest does not run doctests, so `cargo test --doc` runs
        # them.
        run: |
          cargo nextest run --workspace --all-features --no-fail-fast
          cargo test --workspace --all-features --doc
          cargo nextest run -p clove-cli -p cloved --no-fail-fast
      - name: Benchmarks compile (T-X01)
        # Build and link the bench targets in the test profile, which reuses the
        # artifacts of the Test step. `cargo bench --no-run` used the bench
        # profile, which inherits the release profile (fat LTO, codegen-units=1),
        # and rebuilt the whole workspace that way: 3.5 to 12 minutes per OS.
        run: cargo test --workspace --all-features --benches --no-run

  web-frontend:
    name: web frontend (check + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/clove-web/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/clove-web/web/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Svelte check
        run: npm run check
      - name: Unit tests (vitest)
        run: npm run test

  perf-gates:
    name: perf gates (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # Enforce the DESIGN §13.1 file-scan budgets and the DESIGN §6 index
      # budgets (reindex, ls, ready, search, staleness). Both files only assert
      # in optimized builds (debug is several times slower), and the ordinary
      # test job is a debug build, so this job is the only place they can fail.
      - name: Perf gate tests
        run: |
          cargo test --release -p clove-core --test perf_gates
          cargo test --release -p clove-index --test index_perf_gates

  fuzz:
    name: fuzz (30s/target)
    runs-on: ubuntu-latest
    # The repo-root rust-toolchain.toml pins `stable`, which rustup honors over
    # the action's default for any cargo invocation in the tree. cargo-fuzz needs
    # nightly (`-Z` sanitizer flags), so force the toolchain explicitly here.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # T-X02 regression: each target runs 30s against its committed seed corpus.
      - name: Fuzz parse_item_file
        run: cargo fuzz run parse_item_file -- -max_total_time=30
      - name: Fuzz parse_dep_list
        run: cargo fuzz run parse_dep_list -- -max_total_time=30
      - name: Fuzz merge_driver
        run: cargo fuzz run merge_driver -- -max_total_time=30
      - name: Fuzz import_tk
        run: cargo fuzz run import_tk -- -max_total_time=30
      - name: Fuzz import_beads
        run: cargo fuzz run import_beads -- -max_total_time=30

  daemon-windows:
    name: daemon (windows)
    runs-on: windows-latest
    # A hang (a detached hub holding a pipe the smoke script reads) must fail
    # fast, not run to the 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # Windows daemon gate: compile the Windows named-event
      # shutdown path (cloved CreateEventW + `clove daemon stop` OpenEventW/SetEvent),
      # run the platform-agnostic daemon unit tests, and drive the real binaries
      # end to end. The daemon integration suites are `#![cfg(unix)]` and run on
      # the ubuntu/macos matrix; the smoke script is Windows' stand-in for them.
      - name: Build daemon (windows shutdown path)
        # The smoke script drives the web API, so build the `web` feature in.
        run: cargo build -p cloved -p clove-cli --features cloved/web,clove-cli/web
      - name: Daemon unit tests
        # `cloved` is a binary crate (no lib target), so its unit tests live in
        # the bin and run with --bins; --lib finds no targets and errors.
        run: cargo test -p cloved --bins
      - name: Daemon end-to-end smoke
        shell: bash
        run: scripts/ci/daemon-smoke.sh "$PWD/target/debug"

  feature-matrix:
    name: feature combos + release size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # Default-on features (mcp, git-sync) are trimmed aggressively for binary
      # size, and several deps now opt out of their own default features. The
      # opt-out build paths are first-class shipping configs (a lean CLI with no
      # MCP, a daemon with no vendored libgit2), so guard that they keep compiling
      # — the `--no-default-features` arms must still resolve cleanly. (GitHub sync
      # is no longer a feature of these crates; it is the clove-sync-github plugin.)
      - name: clove without mcp (lean CLI)
        run: cargo check -p clove-cli --no-default-features
      - name: cloved without git-sync
        run: cargo check -p cloved --no-default-features
      # `web` is off by default: a plain `cargo install clove-cli` / `cloved` must
      # not link the HTTP server or the embedded SPA, and the opt-in build must
      # still compile. The first step asserts the default tree has no clove-web.
      - name: default builds carry no web server
        run: cargo xtask guard-no-web
      - name: clove and cloved with the web feature
        run: cargo check -p clove-cli -p cloved --features clove-cli/web,cloved/web
      # The plugin SDK (clove-types, clove-plugin, clove-plugin-echo) is MIT OR
      # Apache-2.0 while the rest of clove is AGPL-3.0-only, so a plugin built on
      # the SDK alone can use any license. Workspace builds unify features across
      # every crate, which would hide an SDK that only compiles with an AGPL crate
      # in the graph, so the SDK is linted and tested on its own (`-p`), and its
      # dependency tree (default and --all-features, every target, normal + build
      # edges) must carry no copyleft license. The positive control fails the step
      # if cargo tree stops printing the expected rows, so it cannot pass vacuously.
      - name: SDK builds alone
        run: |
          cargo clippy -p clove-types -p clove-plugin -p clove-plugin-echo --all-targets -- -D warnings
          cargo test -p clove-types -p clove-plugin
      - name: SDK license guard (no copyleft dependency)
        run: cargo xtask guard-sdk-licenses
      # The registry client (ureq -> rustls) must stay on `ring`. A rustls with
      # default features unifies the tree onto aws-lc-sys and triples the binary,
      # so the workspace pins `ring` explicitly (root Cargo.toml).
      #
      # What this actually asserts: aws-lc-sys is unreachable through **normal**
      # (non-dev, non-build) edges. `-e normal` is what does the scoping. `-p` is
      # deliberately absent: it does NOT restrict `-i`, and cargo silently ignores
      # an unknown `-p` and widens to the whole workspace, so including it would
      # only imply a filter that is not there. The `-e normal` restriction is
      # required regardless — aws-lc-sys is legitimately reachable via clove-cli's
      # `jsonschema` dev-dependency, and it stays in Cargo.lock through
      # clove-sync-github's octocrab either way.
      - name: registry TLS stays on ring (no aws-lc-sys via normal edges)
        run: cargo xtask guard-tls
      # Informational: track the shipped binary size. The release profile is fat
      # LTO + codegen-units=1 + panic=abort + strip (see root Cargo.toml). cargo
      # forces the test/bench harness back to unwind, so `cargo test --release`
      # and `cargo bench --no-run` are unaffected by panic=abort.
      - name: Release binary size
        # Build the lean core AND the clove-sync-github plugin so the GitHub-sync
        # size cost is visible — it now lives entirely in the separately-installed
        # plugin, not in `clove`/`cloved`.
        run: |
          cargo build --release -p clove-cli -p cloved
          echo "== lean core =="; ls -l target/release/clove target/release/cloved
          cargo build --release -p clove-sync-github
          echo "== clove-sync-github plugin =="; ls -l target/release/clove-sync-github

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    env:
      CLOVE_SKIP_WEB_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      # The version is `rust-version` in the root Cargo.toml
      # (xtask/tests/versions.rs checks that the two agree).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # `+1.91.0` is required: rust-toolchain.toml would select the pinned
      # version otherwise.
      - name: Build the workspace with the minimum version
        run: cargo +1.91.0 check --workspace --all-features --locked

  notices:
    name: third-party notices (cargo-about)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0
      # The release workflow writes THIRD_PARTY_LICENSES.txt with
      # `cargo about generate --fail`, after the tag is pushed. Run the same
      # command here, for every release target, so a dependency whose license
      # cargo-about rejects fails the pull request and not the release. The
      # version is the one release.yml installs.
      - name: Install cargo-about
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-about@0.9.2
      - name: Generate the notices for every release target
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
            cargo about generate --fail --target "$target" \
              --features "clove-cli/full,cloved/full" about.hbs > /dev/null
            echo "ok: $target"
          done

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # License/advisory/ban checks are platform-independent — run once.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
